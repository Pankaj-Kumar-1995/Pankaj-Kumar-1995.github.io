<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <!-- Grid lines -->
  <line x1="0" y1="80" x2="1200" y2="80" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="0" y1="160" x2="1200" y2="160" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="0" y1="240" x2="1200" y2="240" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="0" y1="320" x2="1200" y2="320" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="400" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="400" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="400" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="400" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="1000" y1="0" x2="1000" y2="400" stroke="white" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Mini bar chart (left panel) -->
  <rect x="60" y="80" width="280" height="220" rx="8" fill="white" fill-opacity="0.08"/>
  <text x="200" y="105" text-anchor="middle" fill="white" fill-opacity="0.6" font-size="11" font-family="sans-serif">Top Complaint Categories</text>
  <rect x="85" y="240" width="30" height="50" fill="#60a5fa" rx="2"/>
  <rect x="125" y="210" width="30" height="80" fill="#60a5fa" rx="2"/>
  <rect x="165" y="190" width="30" height="100" fill="#60a5fa" rx="2" opacity="0.9"/>
  <rect x="205" y="220" width="30" height="70" fill="#60a5fa" rx="2" opacity="0.8"/>
  <rect x="245" y="250" width="30" height="40" fill="#60a5fa" rx="2" opacity="0.7"/>
  <rect x="285" y="260" width="30" height="30" fill="#60a5fa" rx="2" opacity="0.6"/>
  <line x1="80" y1="295" x2="325" y2="295" stroke="white" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Mini line chart (middle panel) -->
  <rect x="380" y="80" width="280" height="220" rx="8" fill="white" fill-opacity="0.08"/>
  <text x="520" y="105" text-anchor="middle" fill="white" fill-opacity="0.6" font-size="11" font-family="sans-serif">LSTM vs Actual — Daily Volume</text>
  <!-- Actual line (green) -->
  <polyline points="405,240 435,220 465,245 495,195 525,210 555,185 585,230 615,200 635,215" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.9"/>
  <!-- LSTM line (blue dashed) -->
  <polyline points="405,238 435,222 465,242 495,198 525,212 555,188 585,228 615,202 635,213" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="5,3" stroke-opacity="0.9"/>
  <!-- SARIMA line (orange dashed) -->
  <polyline points="405,242 435,225 465,248 495,202 525,208 555,192 585,235 615,205 635,218" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3" stroke-opacity="0.7"/>
  <line x1="400" y1="295" x2="640" y2="295" stroke="white" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Mini map (right panel) -->
  <rect x="700" y="80" width="440" height="220" rx="8" fill="white" fill-opacity="0.08"/>
  <text x="920" y="105" text-anchor="middle" fill="white" fill-opacity="0.6" font-size="11" font-family="sans-serif">NYC Geospatial Complaint Clusters</text>
  <!-- Manhattan cluster dots -->
  <circle cx="880" cy="160" r="28" fill="#818cf8" fill-opacity="0.4"/>
  <circle cx="890" cy="155" r="5" fill="#818cf8"/>
  <circle cx="875" cy="165" r="4" fill="#818cf8"/>
  <circle cx="885" cy="172" r="3" fill="#a78bfa"/>
  <!-- Brooklyn cluster -->
  <circle cx="920" cy="200" r="22" fill="#34d399" fill-opacity="0.35"/>
  <circle cx="925" cy="198" r="4" fill="#34d399"/>
  <circle cx="915" cy="206" r="3" fill="#34d399"/>
  <!-- Queens cluster -->
  <circle cx="970" cy="155" r="20" fill="#fbbf24" fill-opacity="0.35"/>
  <circle cx="975" cy="153" r="4" fill="#fbbf24"/>
  <circle cx="965" cy="160" r="3" fill="#fcd34d"/>
  <!-- Bronx cluster -->
  <circle cx="860" cy="130" r="16" fill="#f87171" fill-opacity="0.35"/>
  <circle cx="864" cy="128" r="3" fill="#f87171"/>
  <!-- Staten Island -->
  <circle cx="840" cy="220" r="12" fill="#60a5fa" fill-opacity="0.35"/>
  <circle cx="843" cy="218" r="2.5" fill="#60a5fa"/>
  <!-- Borough labels -->
  <text x="875" y="145" text-anchor="middle" fill="white" fill-opacity="0.7" font-size="8" font-family="sans-serif">Manhattan</text>
  <text x="924" y="188" text-anchor="middle" fill="white" fill-opacity="0.7" font-size="8" font-family="sans-serif">Brooklyn</text>
  <text x="975" y="145" text-anchor="middle" fill="white" fill-opacity="0.7" font-size="8" font-family="sans-serif">Queens</text>
  <!-- Decorative map border lines -->
  <line x1="720" y1="295" x2="1120" y2="295" stroke="white" stroke-opacity="0.3" stroke-width="1"/>

  <!-- KPI badges -->
  <rect x="60" y="330" width="160" height="44" rx="6" fill="white" fill-opacity="0.12"/>
  <text x="140" y="347" text-anchor="middle" fill="white" fill-opacity="0.7" font-size="9" font-family="sans-serif">FORECAST ACCURACY</text>
  <text x="140" y="364" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="sans-serif">92%</text>

  <rect x="240" y="330" width="160" height="44" rx="6" fill="white" fill-opacity="0.12"/>
  <text x="320" y="347" text-anchor="middle" fill="white" fill-opacity="0.7" font-size="9" font-family="sans-serif">ALLOCATION ERRORS</text>
  <text x="320" y="364" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="sans-serif">−45%</text>

  <rect x="420" y="330" width="160" height="44" rx="6" fill="white" fill-opacity="0.12"/>
  <text x="500" y="347" text-anchor="middle" fill="white" fill-opacity="0.7" font-size="9" font-family="sans-serif">ANNUAL SAVINGS</text>
  <text x="500" y="364" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="sans-serif">$2.3M</text>

  <rect x="600" y="330" width="160" height="44" rx="6" fill="white" fill-opacity="0.12"/>
  <text x="680" y="347" text-anchor="middle" fill="white" fill-opacity="0.7" font-size="9" font-family="sans-serif">DATA RECORDS</text>
  <text x="680" y="364" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="sans-serif">150M+</text>

  <rect x="780" y="330" width="160" height="44" rx="6" fill="white" fill-opacity="0.12"/>
  <text x="860" y="347" text-anchor="middle" fill="white" fill-opacity="0.7" font-size="9" font-family="sans-serif">MODEL</text>
  <text x="860" y="364" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="sans-serif">LSTM</text>

  <rect x="960" y="330" width="180" height="44" rx="6" fill="white" fill-opacity="0.12"/>
  <text x="1050" y="347" text-anchor="middle" fill="white" fill-opacity="0.7" font-size="9" font-family="sans-serif">RESPONSE IMPROVEMENT</text>
  <text x="1050" y="364" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="sans-serif">+18%</text>
</svg>
